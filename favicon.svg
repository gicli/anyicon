<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- 둥근 스퀴클 배경 -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />
  <!-- 내부 글로우 테두리 -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />
  
  <!-- 아이콘 프레임 -->
  <rect x="110" y="110" width="220" height="220" rx="48" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="6" />
  
  <!-- 마법봉 및 스파클 (교체/생성 상징) -->
  <path d="M170 342 L342 170" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
  <circle cx="342" cy="170" r="18" fill="#ffd700" filter="url(#glow)" />
  
  <!-- 스파클 별모양 -->
  <path d="M370 280 L380 305 L405 315 L380 325 L370 350 L360 325 L335 315 L360 305 Z" fill="#ffd700" />
  <path d="M150 160 L156 175 L171 181 L156 187 L150 202 L144 187 L129 181 L144 175 Z" fill="#ffffff" />
</svg>
